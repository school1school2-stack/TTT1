<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصحيح والتغذية الراجعة المفصلة - ثانوية الأمير عبدالمجيد</title>
    <!-- مكتبة Firebase للاتصال بقاعدة بيانات لوحتك -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card-bg: #ffffff; --accent: #0284c7;
            --text-main: #1e293b; --text-sub: #64748b; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .scanner-container { max-width: 900px; width: 100%; background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px dashed var(--accent); }
        h1 { color: var(--accent); font-size: 1.5rem; text-align: center; margin-top: 0; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        
        /* قائمة اختيار الطالب الذكية */
        .student-select-box { position: relative; width: 100%; }
        .student-search-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        .student-dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 0 0 10px 10px; max-height: 180px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .student-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .student-item:hover { background: #e0f2fe; color: #0369a1; font-weight: bold; }

        /* بطاقة عرض النتيجة الفورية */
        .score-card { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .score-card h2 { margin: 0; font-size: 1.8rem; }
        .score-card p { margin: 5px 0 0 0; font-size: 0.95rem; opacity: 0.9; }

        /* أقسام العرض */
        .section-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .grid-20 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .ans-card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 6px; text-align: center; }
        .ans-card span { font-size: 0.75rem; font-weight: bold; color: var(--accent); display: block; margin-bottom: 2px; }
        
        /* أزرار خيارات الطالب ونموذج الإجابة (أ، ب، ج، د) */
        .options-group { display: flex; justify-content: center; gap: 3px; }
        .opt-btn { background: #f1f5f9; border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: #334155; }
        .opt-btn.active { background: #0284c7; color: white; border-color: #0284c7; }
        
        /* أزرار نموذج الإجابة المعتمد بلون مميز */
        .model-btn.active { background: #0369a1 !important; color: white !important; border-color: #0369a1 !important; }

        /* لوحة التغذية الراجعة */
        .diff-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .diff-item { padding: 10px; border-radius: 8px; font-size: 0.85rem; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
        .diff-item.match { background: #ecfdf5; border-color: #10b981; color: #065f46; }
        .diff-item.diff { background: #fef2f2; border-color: #ef4444; color: #991b1b; }

        .ai-helper-box { background: #f0fdf4; border: 1px solid #10b981; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .ai-btn { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; display: inline-block; text-decoration: none; text-align: center; }
        .ai-btn:hover { background: #059669; }
        
        .clear-btn { background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .clear-btn:hover { background: #dc2626; }

        .save-model-btn { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .save-model-btn:hover { background: #0369a1; }

        .submit-btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .submit-btn:hover { background: #059669; }
        .footer-note { text-align: center; font-size: 0.75rem; color: var(--text-sub); margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
    </style>
</head>
<body>

<div class="scanner-container">
    <h1>📷 أداة التصحيح والتغذية الراجعة المفصلة</h1>
    <p class="subtitle">ثانوية الأمير عبدالمجيد - استدعاء النماذج من السحابة</p>

    <!-- 1. اختيار اسم الطالب في المقدمة -->
    <div class="form-group" style="background: #e0f2fe; padding: 15px; border-radius: 12px; border: 1px solid #bae6fd;">
        <label style="color: #0369a1; font-size: 1rem; margin-bottom: 8px;">1️⃣ ابحث عن اسم الطالب واختاره أولاً:</label>
        <div class="student-select-box">
            <input type="text" id="studentSearchInput" class="student-search-input" placeholder="اكتب اسم الطالب للبحث..." oninput="filterStudents()" onclick="showDropdown()">
            <div id="studentDropdownList" class="student-dropdown-list"></div>
        </div>
    </div>

    <!-- 2. نافذة اختيار واستدعاء النموذج المعتمد من السحابة -->
    <div class="form-group" style="background: #f0fdf4; padding: 15px; border-radius: 12px; border: 1px solid #bbf7d0;">
        <label style="color: #166534; font-size: 1rem; margin-bottom: 8px;">2️⃣ استدعاء أو اختيار النموذج المعتمد من السحابة:</label>
        <div style="display: flex; gap: 8px;">
            <select id="cloudModelSelect" onchange="loadModelFromCloud()" style="flex: 1;">
                <option value="">-- اختر نموذجاً محفوظاً --</option>
            </select>
            <button type="button" class="ai-btn" onclick="fetchCloudModelsList()">تحديث القائمة</button>
        </div>
    </div>

    <!-- 3. نافذة التعبئة الذكية السريعة (اللصق لإجابات الطالب) -->
    <div class="ai-helper-box">
        <label style="color: #047857; margin-bottom: 5px;">3️⃣ نافذة لصق إجابات الطالب الفورية:</label>
        <p style="font-size: 0.82rem; color: #065f46; margin-top: 0; margin-bottom: 10px;">
            الصق إجابات الطالب هنا (أ، ب، ج، د)، أو انقر على (تصفير الخانة) لمسحها:
        </p>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="quickPasteInput" placeholder="الصق حروف الإجابات هنا (أ، ب، ج، د)..." style="flex: 1; padding: 8px; border: 1px solid #10b981; border-radius: 8px; font-size: 0.9rem;">
            <button type="button" class="ai-btn" onclick="applyQuickPaste()">تعبئة فورية</button>
            <button type="button" class="clear-btn" onclick="clearQuickPaste()">تصفير الخانة</button>
        </div>
    </div>

    <!-- 4. تظليل إجابات الطالب اليدوية -->
    <div class="section-box" style="border-color: #10b981; background: #f0fdf4;">
        <label style="color: #047857; margin-bottom: 8px;">4️⃣ إجابات الطالب (للمراجعة أو التعديل الفردي):</label>
        <div class="grid-20" id="studentAnswersContainer"></div>
    </div>

    <!-- 5. مفاتيح الإجابة النموذجية المعتمدة (تفاعل أ، ب، ج، د وحفظ بالسحابة) -->
    <div class="section-box" style="border-color: #0284c7; background: #f0f9ff;">
        <label style="color: #0369a1; margin-bottom: 8px;">5️⃣ مفاتيح النموذج المعتمد (ثابتة لجميع الطلاب حتى تغييرها):</label>
        <div class="grid-20" id="modelKeyContainer"></div>
        
        <div style="margin-top: 15px; display: flex; gap: 8px; align-items: center;">
            <input type="text" id="newModelNameInput" placeholder="اسم النموذج للحفظ (نموذج أ، نموذج ب، نموذج ج)..." value="نموذج أ" style="flex: 1; padding: 10px; border: 1px solid #0284c7; border-radius: 8px; font-size: 0.9rem; background: #fff;">
            <button type="button" class="save-model-btn" onclick="saveModelToCloud()">حفظ النموذج في السحابة</button>
        </div>
    </div>

    <div class="form-group" style="display: none;">
        <label>اسم النموذج الفعلي المرسل:</label>
        <input type="text" id="customModelName" value="نموذج أ">
    </div>

    <!-- بطاقة عرض النتيجة الفورية -->
    <div class="score-card">
        <h2 id="liveScoreDisplay">0 من 20 (0%)</h2>
        <p>🎯 نتيجة الطالب الفورية بالمقارنة مع النموذج المعتمد</p>
    </div>

    <!-- لوحة التغذية الراجعة المفصلة -->
    <div class="form-group">
        <label>📖 تقرير التغذية الراجعة المفصلة للطالب:</label>
        <div class="diff-grid" id="diffGridContainer"></div>
    </div>

    <!-- 6. اعتماد وإرسال -->
    <button class="submit-btn" onclick="processAndSendToDashboard()">6️⃣ اعتماد النتيجة وإرسالها لوحة التحكم</button>

    <div class="footer-note">
        ✨ أ / عبدالعزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStudents = [];
    let studentAnswersState = {};
    let activeModelKeys = {}; // تخزين المفاتيح المعتمدة للأسئلة

    // بنك الأسئلة المدمج والدقيق المطابق للنماذج (أ، ب، ج) المرفقة[cite: 8, 9, 10, 11]
    const modelQuestionsJson = [
        { q: "1. الجملة أو الأداة الأولى في الاختبار:", answerOptions: [{answerText: "أ", isCorrect: true}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "2. علامة جزم الفعل المضارع معتل الآخر:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "3. إعراب كلمة (مجتهدٌ):", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "4. الجملة المبنية للمجهول بشكل صحيح:", answerOptions: [{answerText: "أ", isCorrect: true}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "5. الفعل المضارع في جملة (اجتهد كي تنجحَ):", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: true}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "6. الأداة التي تجزم الفعل المضارع:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "7. نائب الفاعل مرفوع وعلامة رفعه:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "8. إعراب خبر كان وأخواتها:", answerOptions: [{answerText: "أ", isCorrect: true}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "9. الفعل المضارع من الأفعال الخمسة:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: true}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "10. تأثير الأداة (لن) على الفعل المضارع:", answerOptions: [{answerText: "أ", isCorrect: true}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "11. الفاعل في الجملة:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "12. بناء الفعل للمجهول:", answerOptions: [{answerText: "أ", isCorrect: true}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "13. عمل (إن وأخواتها):", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: true}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "14. الفعل المضارع المجزوم بالسكون الصحيح:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: true}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "15. الفعل المجزوم بحذف حرف العلة:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: true}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "16. الضبط الصحيح بعد النواسخ:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: true}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] },
        { q: "17. الفعل المضارع المرفوع بالضمة الظاهرة:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "18. الجملة المبنية للمعلوم:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "19. الأفعال الخمسة المرفوعة بثبوت النون:", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: false}, {answerText: "ج", isCorrect: true}, {answerText: "د", isCorrect: false}] },
        { q: "20. عمل (كان وأخواتها):", answerOptions: [{answerText: "أ", isCorrect: false}, {answerText: "ب", isCorrect: true}, {answerText: "ج", isCorrect: false}, {answerText: "د", isCorrect: false}] }
    ];

    window.onload = function() {
        for (let i = 1; i <= 20; i++) {
            studentAnswersState[i] = 'A';
            let qData = modelQuestionsJson[i-1];
            let correctIndex = qData.answerOptions.findIndex(opt => opt.isCorrect);
            let mapIdxToKey = ['A', 'B', 'C', 'D'];
            activeModelKeys[i] = mapIdxToKey[correctIndex] || 'A';
        }
        buildStudentAnswersGrid();
        buildModelKeyGrid();
        loadAllowedStudents();
        fetchCloudModelsList();
        updateComparison();
    };

    function buildStudentAnswersGrid() {
        const container = document.getElementById('studentAnswersContainer');
        container.innerHTML = '';
        const keys = ['A', 'B', 'C', 'D'];
        const labels = {'A':'أ', 'B':'ب', 'C':'ج', 'D':'د'};

        for (let i = 1; i <= 20; i++) {
            let currentVal = studentAnswersState[i];
            let optHtml = '';
            keys.forEach(k => {
                let activeClass = (currentVal === k) ? 'opt-btn active' : 'opt-btn';
                optHtml += `<button type="button" class="${activeClass}" onclick="setStudentAns(${i}, '${k}')">${labels[k]}</button>`;
            });

            container.innerHTML += `
                <div class="ans-card">
                    <span>س ${i}</span>
                    <div class="options-group" id="q_opts_${i}">
                        ${optHtml}
                    </div>
                </div>
            `;
        }
    }

    function buildModelKeyGrid() {
        const container = document.getElementById('modelKeyContainer');
        container.innerHTML = '';
        const keys = ['A', 'B', 'C', 'D'];
        const labels = {'A':'أ', 'B':'ب', 'C':'ج', 'D':'د'};

        for (let i = 1; i <= 20; i++) {
            let currentVal = activeModelKeys[i];
            let optHtml = '';
            keys.forEach(k => {
                let activeClass = (currentVal === k) ? 'opt-btn model-btn active' : 'opt-btn model-btn';
                optHtml += `<button type="button" class="${activeClass}" onclick="setModelKey(${i}, '${k}')">${labels[k]}</button>`;
            });

            container.innerHTML += `
                <div class="ans-card" style="background:#f0f9ff;">
                    <span>س ${i}</span>
                    <div class="options-group" id="model_opts_${i}">
                        ${optHtml}
                    </div>
                </div>
            `;
        }
    }

    function setModelKey(qNum, ansKey) {
        activeModelKeys[qNum] = ansKey;
        updateModelKeyButtonUI(qNum, ansKey);
        updateComparison();
    }

    function updateModelKeyButtonUI(qNum, ansKey) {
        const container = document.getElementById(`model_opts_${qNum}`);
        if (!container) return;
        const buttons = container.getElementsByTagName('button');
        const keys = ['A', 'B', 'C', 'D'];
        
        for(let j=0; j<buttons.length; j++) {
            if(keys[j] === ansKey) {
                buttons[j].className = 'opt-btn model-btn active';
            } else {
                buttons[j].className = 'opt-btn model-btn';
            }
        }
    }

    function setStudentAns(qNum, ansKey) {
        studentAnswersState[qNum] = ansKey;
        updateStudentButtonUI(qNum, ansKey);
        updateComparison();
    }

    function updateStudentButtonUI(qNum, ansKey) {
        const container = document.getElementById(`q_opts_${qNum}`);
        if (!container) return;
        const buttons = container.getElementsByTagName('button');
        const keys = ['A', 'B', 'C', 'D'];
        
        for(let j=0; j<buttons.length; j++) {
            if(keys[j] === ansKey) {
                buttons[j].className = 'opt-btn active';
            } else {
                buttons[j].className = 'opt-btn';
            }
        }
    }

    function applyQuickPaste() {
        let text = document.getElementById('quickPasteInput').value.trim();
        let chars = text.replace(/[^أبجدهABCDabcd]/g, '').toUpperCase();
        const mapArabToEng = {'أ': 'A', 'ب': 'B', 'ج': 'C', 'د': 'D'};
        
        let index = 0;
        for (let i = 1; i <= 20; i++) {
            if (index < chars.length) {
                let ch = chars[index];
                let engKey = mapArabToEng[ch] || ch;
                if (['A', 'B', 'C', 'D'].includes(engKey)) {
                    studentAnswersState[i] = engKey;
                    updateStudentButtonUI(i, engKey);
                }
                index++;
            }
        }
        updateComparison();
    }

    function clearQuickPaste() {
        document.getElementById('quickPasteInput').value = '';
        for (let i = 1; i <= 20; i++) {
            studentAnswersState[i] = 'A';
            updateStudentButtonUI(i, 'A');
        }
        updateComparison();
    }

    // حفظ النموذج المعتمد في السحابة تحت أي اسم (مثل: نموذج أ، نموذج ب، نموذج ج)
    async function saveModelToCloud() {
        const modelName = document.getElementById('newModelNameInput').value.trim();
        if(!modelName) {
            alert('الرجاء كتابة اسم النموذج أولاً.');
            return;
        }

        try {
            await db.collection("approved_models").doc(modelName).set({
                model_name: modelName,
                keys: activeModelKeys,
                updated_at: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('customModelName').value = modelName;
            alert(`✅ تم حفظ مفاتيح (${modelName}) في السحابة بنجاح!`);
            fetchCloudModelsList();
        } catch (error) {
            alert("حدث خطأ أثناء حفظ النموذج في السحابة.");
        }
    }

    // جلب قائمة النماذج المحفوظة من السحابة وتعبئة القائمة المنسدلة
    function fetchCloudModelsList() {
        const select = document.getElementById('cloudModelSelect');
        db.collection("approved_models").get().then((snapshot) => {
            select.innerHTML = '<option value="">-- اختر نموذجاً محفوظاً من السحابة --</option>';
            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.model_name) {
                    let opt = document.createElement('option');
                    opt.value = data.model_name;
                    opt.textContent = data.model_name;
                    select.appendChild(opt);
                }
            });
        });
    }

    // استدعاء النموذج المحدد من السحابة وتعبئة أزراره تلقائياً
    async function loadModelFromCloud() {
        const modelName = document.getElementById('cloudModelSelect').value;
        if(!modelName) return;

        try {
            const docRef = await db.collection("approved_models").doc(modelName).get();
            if(docRef.exists) {
                const data = docRef.data();
                activeModelKeys = data.keys || {};
                document.getElementById('newModelNameInput').value = modelName;
                document.getElementById('customModelName').value = modelName;
                
                buildModelKeyGrid();
                updateComparison();
                alert(`✅ تم استدعاء (${modelName}) من السحابة بنجاح وجاهز للتصحيح!`);
            } else {
                alert("النموذج غير موجود في السحابة.");
            }
        } catch (error) {
            alert("حدث خطأ أثناء استدعاء النموذج.");
        }
    }

    function updateComparison() {
        const diffContainer = document.getElementById('diffGridContainer');
        diffContainer.innerHTML = '';

        let score = 0;

        for (let i = 1; i <= 20; i++) {
            const studentVal = studentAnswersState[i];
            const qData = modelQuestionsJson[i-1];
            const correctVal = activeModelKeys[i] || 'A';
            const isMatch = (studentVal === correctVal);

            if (isMatch) score++;

            const itemClass = isMatch ? 'diff-item match' : 'diff-item diff';
            const statusText = isMatch ? '🟢 إجابة صحيحة' : '🔴 إجابة خاطئة';

            diffContainer.innerHTML += `
                <div class="${itemClass}">
                    <div style="display:flex; justify-content:space-between; font-weight:bold;">
                        <span>السؤال (${i}): ${qData.q}</span>
                        <span>${statusText}</span>
                    </div>
                    <div style="font-size:0.8rem; opacity:0.9;">
                        إجابة الطالب: <strong>${studentVal}</strong> | النموذج المعتمد: <strong>${correctVal}</strong>
                    </div>
                </div>
            `;
        }

        let percentage = Math.round((score / 20) * 100);
        document.getElementById('liveScoreDisplay').innerText = `${score} من 20 (${percentage}%)`;
    }

    function loadAllowedStudents() {
        db.collection("allowed_students").orderBy("name").get().then((snapshot) => {
            allStudents = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.name) allStudents.push(data.name);
            });
            renderStudentDropdown(allStudents);
        });
    }

    function renderStudentDropdown(studentsArray) {
        const listDiv = document.getElementById('studentDropdownList');
        listDiv.innerHTML = '';
        if (studentsArray.length === 0) {
            listDiv.innerHTML = '<div class="student-item" style="color:#999;">لا توجد نتائج مطابقة</div>';
            return;
        }
        studentsArray.forEach(name => {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerText = name;
            item.onclick = function() {
                document.getElementById('studentSearchInput').value = name;
                listDiv.style.display = 'none';
            };
            listDiv.appendChild(item);
        });
    }

    function showDropdown() {
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    function filterStudents() {
        const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
        const filtered = allStudents.filter(name => name.toLowerCase().includes(query));
        renderStudentDropdown(filtered);
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.student-select-box')) {
            document.getElementById('studentDropdownList').style.display = 'none';
        }
    });

    async function processAndSendToDashboard() {
        const studentName = document.getElementById('studentSearchInput').value.trim();
        const customModelName = document.getElementById('customModelName').value.trim() || "نموذج أ";

        if (!studentName) {
            alert('الرجاء اختيار اسم الطالب من القائمة أولاً.');
            return;
        }

        let answersDetails = [];
        let score = 0;
        
        for (let i = 1; i <= 20; i++) {
            let studentAnsKey = studentAnswersState[i]; 
            let qData = modelQuestionsJson[i-1];
            let correctAnsKey = activeModelKeys[i] || 'A'; 
            let isCorrect = (studentAnsKey === correctAnsKey);
            if (isCorrect) score++;

            answersDetails.push({
                qText: qData.q,
                studentAns: studentAnsKey,
                correctAns: correctAnsKey,
                isCorrect: isCorrect,
                skill: i <= 4 ? 'est' : i <= 8 ? 'ikm' : i <= 12 ? 'swh' : i <= 16 ? 'arb' : 'sah'
            });
        }

        let p = Math.round((score / 20) * 100);
        let skillsObj = { est: p, ikm: p, swh: p, arb: p, sah: p, math: p };

        let recordData = {
            name: studentName,
            score: score,
            total: 20,
            model_id: customModelName,
            answers: answersDetails,
            sections: skillsObj,
            time: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("alkfaeat_results").add(recordData);
            alert(`✅ تم اعتماد درجة الطالب (${studentName}) بنجاح تحت اسم (${customModelName})!\nالدرجة النهائية: ${score} من 20 (${p}%) وتم إرسال التغذية الراجعة لوحة التحكم.`);
            
            // تصفير اسم الطالب وخانة اللصق فقط دون المساس بمفاتيح النموذج المعتمد
            clearQuickPaste();
            document.getElementById('studentSearchInput').value = '';
        } catch (error) {
            alert("حدث خطأ أثناء الإرسال لقاعدة البيانات.");
        }
    }
</script>
